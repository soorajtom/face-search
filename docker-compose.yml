version: '3.8'

services:
  web:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/usr/src/app
      - ./computed_faces.json:/usr/src/app/computed_faces.json
    environment:
      - DJANGO_SETTINGS_MODULE=backend.settings
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
